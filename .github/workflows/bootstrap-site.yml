name: Bootstrap Vehylo website

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/bootstrap-site.yml

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify website
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/chunk* > /tmp/vehylo-web-site.tar.gz.b64
          base64 --decode /tmp/vehylo-web-site.tar.gz.b64 > /tmp/vehylo-web-site.tar.gz
          echo "3f77df71cf1404602d060786b3fc79a638c43165d84568f53ea10aae8324d7fe  /tmp/vehylo-web-site.tar.gz" | sha256sum --check --strict
          tar -xzf /tmp/vehylo-web-site.tar.gz -C .

      - name: Commit complete website
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-site.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build complete Vehylo website"
          git push origin HEAD:main

# Triggered through a server-side merge event.
