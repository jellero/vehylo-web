<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07100f"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>Vehylo — Vehicle intelligence</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#07100f;color:#eaf8f1;font:16px/1.5 system-ui,sans-serif}body{display:grid;place-items:center;padding:2rem}main{text-align:center;max-width:36rem}.logo{width:58px;height:58px;margin:auto;border:1px solid #2e5c4c;border-radius:18px;display:grid;place-items:center;color:#50f2b0;font-size:30px;box-shadow:0 0 55px #1cd88a35}.ring{width:38px;height:38px;margin:1.5rem auto;border:3px solid #29463d;border-top-color:#50f2b0;border-radius:50%;animation:r .8s linear infinite}@keyframes r{to{transform:rotate(360deg)}}p{color:#a8c2b8}small{display:block;color:#769489;margin-top:1rem}a{color:#50f2b0}</style></head><body><main><div class="logo">V</div><h1>Vehylo</h1><p data-status>Preparazione interfaccia completa…</p><div class="ring"></div><small data-error>Telemetria · diagnostica · mapping · dashcam · web radio</small><noscript>JavaScript è necessario. <a href="https://github.com/jellero/vehylo-web">Apri il repository</a>.</noscript></main><script>
(async () => {
  const status = document.querySelector('[data-status]');
  const details = document.querySelector('[data-error]');
  const setStatus = (text) => { if (status) status.textContent = text; };
  const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));
  const getPart = async (name) => {
    const url = '.site/' + name + '?v=3a35ebd3';
    for (let attempt = 0; attempt < 3; attempt += 1) {
      const response = await fetch(url, { cache: 'no-store' });
      if (response.ok) return (await response.text()).trim();
      if (attempt < 2) await sleep(500 * (attempt + 1));
    }
    throw new Error('Componente non disponibile: ' + name);
  };
  try {
    setStatus('Download interfaccia…');
    const names = ['part00','part01','part02','part03','part04','part05'];
    const pieces = await Promise.all(names.map(getPart));
    const binary = atob(pieces.join(''));
    const compressed = Uint8Array.from(binary, c => c.charCodeAt(0));
    setStatus('Verifica e decompressione…');
    if (!globalThis.crypto?.subtle) throw new Error('Verifica crittografica non disponibile');
    const digestBytes = new Uint8Array(await crypto.subtle.digest('SHA-256', compressed));
    const digest = Array.from(digestBytes, byte => byte.toString(16).padStart(2, '0')).join('');
    if (digest !== '3a35ebd33779a21799120e2732ab0424192adcf648e6e40ef4be93028fbf5fcf') throw new Error('Integrità del sito non valida');
    if (!('DecompressionStream' in globalThis)) throw new Error('Aggiorna il browser per aprire il sito');
    const stream = new Blob([compressed]).stream().pipeThrough(new DecompressionStream('gzip'));
    const tar = new Uint8Array(await new Response(stream).arrayBuffer());
    const decoder = new TextDecoder();
    const files = new Map();
    const parseOctal = bytes => parseInt(decoder.decode(bytes).replace(/\0.*$/, '').trim() || '0', 8);
    for (let offset = 0; offset + 512 <= tar.length;) {
      const header = tar.slice(offset, offset + 512);
      if (header.every(value => value === 0)) break;
      const name = decoder.decode(header.slice(0, 100)).replace(/\0.*$/, '');
      const prefix = decoder.decode(header.slice(345, 500)).replace(/\0.*$/, '');
      const path = ((prefix ? prefix + '/' : '') + name).replace(/^\.\//, '');
      const size = parseOctal(header.slice(124, 136));
      const start = offset + 512;
      files.set(path, tar.slice(start, start + size));
      offset = start + Math.ceil(size / 512) * 512;
    }
    const text = path => {
      const value = files.get(path);
      if (!value) throw new Error('File assente nel pacchetto: ' + path);
      return decoder.decode(value);
    };
    const dataUrl = (path, mime) => {
      const bytes = files.get(path);
      if (!bytes) return path;
      let raw = '';
      for (let i = 0; i < bytes.length; i += 8192) raw += String.fromCharCode(...bytes.subarray(i, i + 8192));
      return 'data:' + mime + ';base64,' + btoa(raw);
    };
    let html = text('index.html');
    html = html.replace('<link rel="stylesheet" href="styles.css">', '<style>' + text('styles.css') + '</style>');
    const scriptOpen = '<scr' + 'ipt>';
    const scriptClose = '</scr' + 'ipt>';
    const externalScript = '<scr' + 'ipt src="script.js" defer></scr' + 'ipt>';
    const embeddedScript = scriptOpen + text('script.js').replace(/<\/script/gi, '<\\/script') + scriptClose;
    html = html.replace(externalScript, embeddedScript);
    html = html.replaceAll('assets/logo-mark.svg', dataUrl('assets/logo-mark.svg', 'image/svg+xml'));
    html = html.replaceAll('assets/og-cover.svg', dataUrl('assets/og-cover.svg', 'image/svg+xml'));
    html = html.replace('<link rel="manifest" href="manifest.webmanifest">', '');
    for (const path of ['privacy.html','terms.html']) {
      const url = URL.createObjectURL(new Blob([text(path)], { type: 'text/html;charset=utf-8' }));
      html = html.replaceAll('href="' + path + '"', 'href="' + url + '"');
    }
    setStatus('Avvio Vehylo…');
    document.open(); document.write(html); document.close();
  } catch (error) {
    console.error(error);
    setStatus('Errore di caricamento');
    if (details) details.textContent = error.message + ' — ricarica la pagina tra pochi secondi.';
  }
})();
</script></body></html>
